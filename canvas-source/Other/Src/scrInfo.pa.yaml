      - btnStart:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =Set(
                  varAppr,
                  txtApprName
              );
              Set(
                  varApprSSO,
                  txtApprSSO
              );
              Set(
                  varInt1,
                  txtInt1Name
              );
              Set(
                  varInt1SSO,
                  txtInt1SSO
              );
              Set(
                  varInt2,
                  txtInt2Name
              );
              Set(
                  varInt2SSO,
                  txtInt2SSO
              );
              Set(
                  varInt3,
                  txtInt3Name
              );
              Set(
                  varInt3SSO,
                  txtInt3SSO
              );
              Set(
                  varInt4,
                  txtInt4Name
              );
              Set(
                  varInt4SSO,
                  txtInt4SSO
              );
              Clear(colQGrade);
              Clear(colWIQGrade);
              // For the Report
              Set(
                  varIntSessionID,
                  Text(GUID())
              );
              Set(
                  varIntID,
                  IntSessionPatch.Run(
                      varAppr.Text,
                      varInt1.Text,
                      varInt2.Text,
                      varInt3.Text,
                      varInt4.Text,
                      varApprSSO.Text,
                      varInt1SSO.Text,
                      varInt2SSO.Text,
                      varInt3SSO.Text,
                      varInt4SSO.Text,
                      Text(Now())
                  ).sessionid
              );
              Reset(txtWIAnswer);
              Reset(txtWIQuestion);
              Navigate(scrON);
              Set(
                  varShowWIPopup,
                  false
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="Start"
            Visible: =!IsBlank(txtApprName.Text) And !IsBlank(txtInt1Name.Text) And !IsBlank(txtInt2Name.Text) And CountRows(colSelectedCats) > 2
            X: =1152
            Y: =640
      - galTopics:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =376
            Items: =Distinct(AP_INT,Cat)
            TemplateSize: =45
            Width: =255
            X: =854
            Y: =229
          Children:
            - chkCat:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  CheckboxBorderColor: =RGBA(96, 94, 92, 1)
                  CheckmarkFill: =RGBA(0, 120, 212, 1)
                  Default: =ThisItem.Value = "General" ||  ThisItem.Value in colSelectedCats || ThisItem.Value = "Mechanical"
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(ThisItem.Value in [ "General", "Mechanical"] , DisplayMode.Disabled,DisplayMode.Edit)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  Height: =34
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(50, 49, 48, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnCheck: |+
                    =Collect(colSelectedCats, {cat:ThisItem.Value})
                  OnSelect: =Select(Parent)
                  OnUncheck: =RemoveIf(colSelectedCats,cat=ThisItem.Value)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(50, 49, 48, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Text: =ThisItem.Value
                  Width: =272
                  X: =10
                  Y: =10
