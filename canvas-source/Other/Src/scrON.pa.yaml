      - btnRefreshInt:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |
              =// =====================================================
              // DETERMINE COMPENSATION CATEGORY
              //
              // Interview target = 24 questions.
              //
              // Every category uses:
              //
              //   2 Questions from Sub A
              //   1 Question from Sub B
              //
              // Total = 3 Questions per category.
              //
              // If fewer than 8 categories are selected,
              // extra questions are assigned using this priority:
              //
              // 1. Electric
              // 2. Mechanical
              // 3. Pneumatics
              // 4. Pumps
              // 5. Hydraulics
              // 6. Conveyors/Brakes
              // 7. Flames
              //
              // General never receives extra questions.
              // =====================================================
              Set(
                  varCompCat,
                  If(
                      !IsBlank(
                          LookUp(
                              colSelectedCats,
                              cat = "Electric",
                              cat
                          )
                      ),
                      "Electric",
                      If(
                          !IsBlank(
                              LookUp(
                                  colSelectedCats,
                                  cat = "Mechanical",
                                  cat
                              )
                          ),
                          "Mechanical",
                          If(
                              !IsBlank(
                                  LookUp(
                                      colSelectedCats,
                                      cat = "Pneumatics",
                                      cat
                                  )
                              ),
                              "Pneumatics",
                              If(
                                  !IsBlank(
                                      LookUp(
                                          colSelectedCats,
                                          cat = "Pumps",
                                          cat
                                      )
                                  ),
                                  "Pumps",
                                  If(
                                      !IsBlank(
                                          LookUp(
                                              colSelectedCats,
                                              cat = "Hydraulics",
                                              cat
                                          )
                                      ),
                                      "Hydraulics",
                                      If(
                                          !IsBlank(
                                              LookUp(
                                                  colSelectedCats,
                                                  cat = "Conveyors/Brakes",
                                                  cat
                                              )
                                          ),
                                          "Conveyors/Brakes",
                                          "Flames"
                                      )
                                  )
                              )
                          )
                      )
                  )
              );
              // =====================================================
              // PRESERVE GRADED QUESTIONS
              //
              // Keep only questions already graded.
              //
              // Ungraded questions are removed and rebuilt.
              // =====================================================
              ClearCollect(
                  colInterviewQuestions,
                  Filter(
                      colInterviewQuestions,
                      ID in colQGrade.QuestionID
                  )
              );
              // =====================================================
              // CALCULATE COMPENSATION AMOUNT
              //
              // Each selected category contributes:
              //
              //   2A + 1B = 3 Questions
              //
              // Missing questions are added to the
              // compensation category while preserving
              // the 2A : 1B ratio.
              // =====================================================
              Set(
                  varMissingQuestions,
                  Max(
                      24 - (CountRows(colSelectedCats) * 3),
                      0
                  )
              );
              // =====================================================
              // REBUILD MISSING QUESTIONS
              //
              // Rules:
              //
              // • A replaces A
              // • B replaces B
              // • Preserve graded questions
              // • Randomized replacements
              // • No duplicates
              // • Compensation category receives extras
              // • Compensation maintains 2A : 1B ratio
              // =====================================================
              ForAll(
                  colSelectedCats As c,
                  With(
                      {
                          TargetA: If(
                              c.cat = varCompCat,
                              2 + RoundDown(
                                  varMissingQuestions * (2 / 3),
                                  0
                              ),
                              2
                          ) + If(
                              c.cat = varBonusCat,
                              varBonusA,
                              0
                          ),
                          TargetB: If(
                              c.cat = varCompCat,
                              1 + RoundUp(
                                  varMissingQuestions * (1 / 3),
                                  0
                              ),
                              1
                          ) + If(
                              c.cat = varBonusCat,
                              varBonusB,
                              0
                          ),
                          CurrentA: CountRows(
                              Filter(
                                  colInterviewQuestions,
                                  Cat = c.cat && Sub = "A"
                              )
                          ),
                          CurrentB: CountRows(
                              Filter(
                                  colInterviewQuestions,
                                  Cat = c.cat && Sub = "B"
                              )
                          )
                      },
                      Collect(
                          colInterviewQuestions,
                          FirstN(
                              Shuffle(
                                  Filter(
                                      AP_INT,
                                      Cat = c.cat && Sub = "A" && !(ID in colInterviewQuestions.ID)
                                  )
                              ),
                              Max(
                                  TargetA - CurrentA,
                                  0
                              )
                          ),
                          FirstN(
                              Shuffle(
                                  Filter(
                                      AP_INT,
                                      Cat = c.cat && Sub = "B" && !(ID in colInterviewQuestions.ID)
                                  )
                              ),
                              Max(
                                  TargetB - CurrentB,
                                  0
                              )
                          )
                      )
                  )
              );
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: |-
              ="Refresh
              "
            Visible: =!varBonusUsed
            X: =420
            Y: =691
