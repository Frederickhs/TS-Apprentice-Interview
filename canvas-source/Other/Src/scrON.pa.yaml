      - Button1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =Color.Orange
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =If(
                  !IsBlank(
                      LookUp(
                          colSelectedCats,
                          cat = "Electric"
                      )
                  ),

                  // Electric Selected
                  Set(varBonusCat, "Mechanical");
              Set(varBonusA, 2);
              Set(varBonusB, 3);

                  Set(varBonusCat, "Mechanical");
                  Set(varBonusA, 2);
                  Set(varBonusB, 3);

                  Collect(
                      colInterviewQuestions,

                      FirstN(
                          Shuffle(
                              Filter(
                                  AP_INT,
                                  Cat = "Mechanical" &&
                                  Sub = "A" &&
                                  !(ID in colInterviewQuestions.ID)
                              )
                          ),
                          2
                      ),

                      FirstN(
                          Shuffle(
                              Filter(
                                  AP_INT,
                                  Cat = "Mechanical" &&
                                  Sub = "B" &&
                                  !(ID in colInterviewQuestions.ID)
                              )
                          ),
                          3
                      )
                  ),

                  // Electric NOT Selected
                  Collect(
                      colSelectedCats,
                      {
                          cat: "Electric"
                      }
                  );

                  Set(varBonusCat, "Electric");
              Set(varBonusA, 2);
              Set(varBonusB, 3);

                  Collect(
                      colInterviewQuestions,

                      FirstN(
                          Shuffle(
                              Filter(
                                  AP_INT,
                                  Cat = "Electric" &&
                                  Sub = "A" &&
                                  !(ID in colInterviewQuestions.ID)
                              )
                          ),
                          2
                      ),

                      FirstN(
                          Shuffle(
                              Filter(
                                  AP_INT,
                                  Cat = "Electric" &&
                                  Sub = "B" &&
                                  !(ID in colInterviewQuestions.ID)
                              )
                          ),
                          3
                      )
                  )
              );

              Set(varBonusUsed,true);
              Notify( varBonusCat & " Questions Added - Refresh Disabled", NotificationType.Information, 3000)
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: |-
              =If(
                  !IsBlank(
                      LookUp(
                          colSelectedCats,
                          cat = "Electric"
                      )
                  ),
                  "Add Mechanical Questions",
                  "Add Electrical Questions"
              )
            Visible: =!varBonusUsed
            Width: =341
            X: =787
            Y: =691
