    btnCompleted As button:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        Fill: |-
            =If(
                CountIf(
                    colQGrade,
                    IsCorrect = "Correct"
                ) + CountIf(
                    colQGrade,
                    IsCorrect = "Incorrect"
                ) + CountIf(
                    colWIQGrade,
                    IsCorrect = "Correct"
                ) + CountIf(
                    colWIQGrade,
                    IsCorrect = "Incorrect"
                ) < 20,
                Color.Gray,
                Color.Green
            )
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        HoverBorderColor: =RGBA(0, 0, 0, 0)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(16, 110, 190, 1)
        OnSelect: |
            =Set(
                varTotalAnswered,
                CountIf(
                    colQGrade,
                    IsCorrect = "Correct"
                ) + CountIf(
                    colQGrade,
                    IsCorrect = "Incorrect"
                ) + CountIf(
                    colWIQGrade,
                    IsCorrect = "Correct"
                ) + CountIf(
                    colWIQGrade,
                    IsCorrect = "Incorrect"
                )
            );
            //This is the message of the board being completed, the PDF will send no mather what
            If(
                Confirm(
                    If(
                        varTotalAnswered < 20,
                        User().FullName & " Interview is not complete (less than 20 answered). Are you sure you want to finish?",
                        varTotalAnswered >= 20,
                        "Are you sure the Interview is completed?"
                    )
                ),
                Navigate(scrReview)
            );
            Set(
                varCorrect,
                If(
                    CountRows(colQGrade) + CountRows(colWIQGrade) = 0,
                    0,
                    RoundDown(
                        (CountIf(
                            colQGrade,
                            IsCorrect = "Correct"
                        ) + CountIf(
                            colWIQGrade,
                            IsCorrect = "Correct"
                        )) / (CountIf(
                            colQGrade,
                            IsCorrect = "Correct"
                        ) + CountIf(
                            colQGrade,
                            IsCorrect = "Incorrect"
                        ) + CountIf(
                            colWIQGrade,
                            IsCorrect = "Correct"
                        ) + CountIf(
                            colWIQGrade,
                            IsCorrect = "Incorrect"
                        )) * 100,
                        0
                    )
                )
            );
            Set(
                varIntStatus,
                If(
                    varCorrect >= 80,
                    "Passed",
                    "Failed"
                )
            );
            //Information for Report, this will update the List
            Patch(
                Int_Data,
                LookUp(
                    Int_Data,
                    ID = varIntID
                ),
                {
                    Int_Result: varIntStatus,
                    TotalCorrect: CountIf(
                        colQGrade,
                        IsCorrect = "Correct"
                    ) + CountIf(
                        colWIQGrade,
                        IsCorrect = "Correct"
                    ),
                    TotalIncorrect: CountIf(
                        colQGrade,
                        IsCorrect = "Incorrect"
                    ) + CountIf(
                        colWIQGrade,
                        IsCorrect = "Incorrect"
                    )
                }
            );
            
            //Placement Questions
            
            ClearCollect(
                colPlacementQuestions,
                {
                    QuestionID: 1,
                    Question: "Work 3rd Shift?"
                },
                {
                    QuestionID: 2,
                    Question: "Work at heights?"
                },
                {
                    QuestionID: 3,
                    Question: "Become Repel Certified?"
                },
                {
                    QuestionID: 4,
                    Question: "Work in confined spaces?"
                },
                {
                    QuestionID: 5,
                    Question: "Pass a swim test?"
                },
                {
                    QuestionID: 6,
                    Question: "Come in contact with chlorinated water?"
                },
                {
                    QuestionID: 7,
                    Question: "Work outside?"
                }
            );
            Clear(colPlacementAnswers)
        PressedBorderColor: =RGBA(0, 69, 120, 1)
        PressedColor: =RGBA(255, 255, 255, 1)
